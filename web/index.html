<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solitaire Enshaded (WebGPU)</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="application-name" content="Solitaire Enshaded">
    <meta name="apple-mobile-web-app-title" content="SolEnshaded">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d140e">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="High-fidelity procedural Solitaire board game built in C++20 and WebGPU with PBR table lighting and custom Eatscript decks.">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b110c;
            color: #e2e8f0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, #152619 0%, #080d09 100%);
            position: relative;
            overflow: hidden;
        }

        canvas#canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            cursor: default;
            touch-action: none;
        }

        /* Luxury Gold/Emerald Loading Screen */
        #app-loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0f0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #app-loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .sol-loader-box {
            background: radial-gradient(circle at center, #18281b 0%, #0d170f 100%);
            border: 2px solid #3c5440;
            border-radius: 14px;
            padding: 36px 52px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 215, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            box-sizing: border-box;
        }

        .sol-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #e8d08c;
            text-shadow: 0 2px 10px rgba(232, 208, 140, 0.25);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .sol-subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: #7da582;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .sol-progress-track {
            width: 280px;
            height: 6px;
            background-color: #090e0a;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #233927;
            position: relative;
            margin-bottom: 16px;
        }

        .sol-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #bfa15f, #f5e29f, #bfa15f);
            background-size: 200% 100%;
            border-radius: 3px;
            transition: width 0.3s ease-out;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sol-status-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            color: #8da692;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .sol-status-text.error-msg {
            color: #ef4444;
            max-width: 320px;
            margin-top: 10px;
        }

        /* Drag-and-Drop Glow Overlay */
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 15, 0.88);
            border: 4px dashed #e8d08c;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        #drop-overlay.active {
            display: flex;
        }

        .drop-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #e8d08c;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .drop-desc {
            font-size: 13px;
            color: #9cb8a1;
        }

        /* Toast Notification */
        #sol-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #142217;
            border: 1px solid #4a6b4f;
            color: #f1f5f9;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
            opacity: 0;
            z-index: 10001;
            pointer-events: none;
        }

        #sol-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" tabindex="-1"></canvas>
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="drop-overlay">
        <div class="drop-title">IMPORT CUSTOM ASSET</div>
        <div class="drop-desc">Drop .eats card deck or table theme to hot-swap</div>
    </div>

    <!-- Toast Notification -->
    <div id="sol-toast">Notification</div>

    <!-- Luxury Loading Screen -->
    <div id="app-loading-screen">
        <div class="sol-loader-box">
            <div class="sol-title">Solitaire Enshaded</div>
            <div class="sol-subtitle">Procedural WebGPU Solitaire</div>
            <div class="sol-progress-track">
                <div class="sol-progress-fill" id="progress-fill"></div>
            </div>
            <div class="sol-status-text" id="status-text">INITIALIZING WEBGPU...</div>
        </div>
    </div>

    <!-- Hidden File Picker for manual file loading -->
    <input type="file" id="eats-file-picker" accept=".eats" style="display: none;">

    <script>
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const dropOverlay = document.getElementById('drop-overlay');
        const toast = document.getElementById('sol-toast');
        const filePicker = document.getElementById('eats-file-picker');

        function showToast(msg, durationMs = 3500) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, durationMs);
        }

        window.hideAppLoadingScreen = function() {
            const screen = document.getElementById('app-loading-screen');
            if (screen) {
                screen.classList.add('fade-out');
                setTimeout(() => screen.remove(), 600);
            }
        };

        // WebGPU Device Acquisition
        let webgpuDevicePromise = null;
        if (navigator.gpu) {
            webgpuDevicePromise = navigator.gpu.requestAdapter().then((adapter) => {
                if (!adapter) throw new Error('No compatible GPUAdapter found.');
                return adapter.requestDevice();
            }).catch((err) => {
                console.error('[WebGPU] Failed to acquire device:', err);
                statusText.className = 'sol-status-text error-msg';
                statusText.innerText = 'Failed to acquire WebGPU device: ' + err.message;
                return null;
            });
        } else {
            statusText.className = 'sol-status-text error-msg';
            statusText.innerText = 'WebGPU is not supported in this browser. Please use a modern browser (Chrome 113+, Edge 113+) with hardware acceleration enabled.';
        }

        // Drag & Drop Bridge for .eats Files
        let dragCounter = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            dropOverlay.classList.add('active');
        });
        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dropOverlay.classList.remove('active');
            }
        });
        window.addEventListener('dragover', (e) => e.preventDefault());

        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('active');

            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                await handleEatsFile(file);
            }
        });

        async function handleEatsFile(file) {
            if (!file.name.endsWith('.eats')) {
                showToast('Please drop a valid .eats recipe file.');
                return;
            }

            try {
                showToast('Loading ' + file.name + ' ...');
                const buf = await file.arrayBuffer();
                const data = new Uint8Array(buf);

                // Write into Emscripten virtual filesystem (MEMFS)
                if (typeof FS !== 'undefined') {
                    try { FS.mkdir('/user'); } catch (err) {}
                    const vPath = '/user/' + file.name;
                    FS.writeFile(vPath, data);

                    // Call exported C ABI
                    if (typeof Module !== 'undefined' && Module.ccall) {
                        const ok = Module.ccall('solenshaded_load_file_from_web', 'boolean', ['string'], [vPath]);
                        if (ok) {
                            showToast('Successfully loaded: ' + file.name);
                        } else {
                            showToast('Failed to parse .eats content: ' + file.name);
                        }
                    }
                }
            } catch (err) {
                console.error('[Drop Error]', err);
                showToast('Error importing file: ' + err.message);
            }
        }

        // Emscripten Module Config
        var Module = {
            preRun: [
                function() {
                    if (webgpuDevicePromise) {
                        Module.addRunDependency('webgpu-device');
                        webgpuDevicePromise.then((device) => {
                            if (device) {
                                Module.preinitializedWebGPUDevice = device;
                                console.log('[WebGPU] Module preinitialized device ready:', device);
                            }
                            Module.removeRunDependency('webgpu-device');
                        }).catch((err) => {
                            console.error('[WebGPU] Device dependency error:', err);
                            Module.removeRunDependency('webgpu-device');
                        });
                    }
                }
            ],
            postRun: [
                function() {
                    window.hideAppLoadingScreen();
                }
            ],
            print: function(text) {
                console.log('[SolEnshaded]', text);
            },
            printErr: function(text) {
                console.error('[SolEnshaded Error]', text);
            },
            canvas: (function() {
                return document.getElementById('canvas');
            })(),
            setStatus: function(text) {
                if (text && text.length > 0 && statusText) {
                    statusText.innerText = text.toUpperCase();
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                const pct = this.totalDependencies ? Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100) : 100;
                if (progressFill) progressFill.style.width = pct + '%';
                Module.setStatus(left ? 'LOADING ASSETS... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'STARTING ENGINE...');
            }
        };

        window.onerror = function(event) {
            if (statusText) {
                statusText.className = 'sol-status-text error-msg';
                statusText.innerText = 'INITIALIZATION ERROR: ' + event;
            }
        };

        // Service Worker for Offline PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('[SolEnshaded PWA] Registered with scope:', reg.scope);
                }).catch((err) => {
                    console.warn('[SolEnshaded PWA] ServiceWorker registration failed:', err);
                });
            });
        }
    </script>
    {{{ SCRIPT }}}
</body>
</html>
